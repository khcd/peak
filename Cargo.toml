[package]
name = "peak"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "peak: authenticated multi-tenant telemetry ingestion backed by ClickHouse"
publish = false
repository = "https://github.com/khcd/peak"
readme = "README.md"
keywords = ["telemetry", "analytics", "clickhouse", "observability", "dashboard"]
categories = ["command-line-utilities", "database"]

[lib]
name = "peak"
path = "src/lib.rs"

[[bin]]
name = "peak"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["server", "cli"]
server = ["dep:axum", "dep:tower-http", "dep:tokio"]
dashboard = ["dep:ratatui", "dep:crossterm", "dep:futures-util"]
cli = ["server", "dashboard", "dep:tracing-subscriber"]

[dependencies]
axum = { version = "0.8", optional = true }
clickhouse = { version = "0.15", features = ["time", "uuid"] }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
futures-util = { version = "0.3.33", optional = true }
getrandom = "0.4"
libc = "0.2"
ratatui = { version = "0.30.2", features = ["crossterm"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
tower-http = { version = "0.7", features = ["decompression-gzip", "decompression-zstd", "limit", "trace"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }
zstd = "0.14"
