# Keep this as live_ping unless the ClickHouse TTL migration is widened for another name.
[[subject_kinds]]
kind = "install"
id_shape = "uuid"

[dashboard]
subject_label = "INSTALLS"
windows = [1, 7, 30]
fleet_dimensions = ["platform", "version", "country"]

[dashboard.liveness]
event_name = "live_ping"
ping_interval_minutes = 5

[events.session_start]
[events.live_ping]

[events.session_end.fields]
duration_ms = { type = "u64", required = true }

[events.feature_used.fields]
feature = { type = "str", max_bytes = 128, required = true }
