[package]
name = "peak"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "peak: authenticated multi-tenant telemetry ingestion backed by ClickHouse"
publish = false
repository = "https://github.com/khcd/peak"
readme = "README.md"

[dependencies]
axum = "0.8"
clickhouse = { version = "0.13", features = ["time", "uuid"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.33"
getrandom = "0.3"
ratatui = { version = "0.30.2", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "decompression-zstd", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }
zstd = "0.13"
