services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.6-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-telemetry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-telemetry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [internal]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  handler:
    build: .
    restart: unless-stopped
    ports:
      # Local desktop development: a client posts directly to the ingest handler.
      # Keep ClickHouse on the internal Docker network.
      - "127.0.0.1:8081:8081"
    environment:
      BIND_ADDR: 0.0.0.0:8081
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-telemetry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-telemetry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      INGEST_KEYS: ${INGEST_KEYS:?set INGEST_KEYS in .env}
      MANIFEST_DIR: /app/tenants
      WAL_PATH: /var/lib/peak/events.wal
      MAX_INSERT_BATCH_EVENTS: ${MAX_INSERT_BATCH_EVENTS:-200}
      BATCH_WAIT_MS: ${BATCH_WAIT_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-25000}
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-UTC}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      RUST_LOG: info
    depends_on:
      - clickhouse
    networks: [internal, edge]
    # Docker's default is 10s, which would SIGKILL the WAL drain part-way through. Keep this
    # comfortably above SHUTDOWN_DRAIN_MS.
    stop_grace_period: 30s
    volumes:
      - ./tenants:/app/tenants:ro
      - handler-data:/var/lib/peak

  caddy:
    # Built rather than pulled: the Caddyfile uses the rate-limit module, which is not in the
    # official image. See deploy/caddy/Dockerfile.
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    environment:
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:?set TELEMETRY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - handler
    networks: [edge]

volumes:
  clickhouse-data:
  handler-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    internal: true
  edge:
